global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: "service"
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: "web"
    static_configs:
      - targets: ["web:8080"]
    metrics_path: "/metrics"
